name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install native test tools
        run: sudo apt-get update && sudo apt-get install -y clang curl python3

      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Vet
        run: go vet ./...

      - name: Build and test
        run: make test

      - name: Run benchmark smoke test
        run: go test -run '^$' -bench BenchmarkResolveJSONPointer -benchtime=100x ./internal/adapter
